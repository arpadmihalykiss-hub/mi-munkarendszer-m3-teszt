name: M-3 kapu

# SZINTETIKUS H-1 TESZT, nem összevonásra szánt.
# Fizetős API nélkül, titok nélkül fut. Minden, a main ágra érkező PR-re lefut
# (nem csak pilot/ ágakra), így nincs ágnév-alapú kikerülés.
# A szkript és a szabályok az ALAP ágból (trusted/) jönnek, a PR-ből (pr/) csak adatot olvasunk.
# A PR kódját soha nem futtatjuk. Hiba vagy váratlan leállás esetén a job piros (fail-closed).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: m3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kapu:
    name: M-3 kapu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: SZINTETIKUS H-1 TESZT (a kapu szándékosan kihagyva)
        run: echo "H-1 teszt - ez a lépés a PR-ben módosított workflow-ból fut, a kapu nem fut"
